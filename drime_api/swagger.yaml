openapi: 3.0.0
info:
  description: 'Access token should be sent along with every request to SITE_NAME API in authorization header: `Authorization: Bearer <Token>` <br> This token can either be acquired via `auth/login` endpoint or from account settings page on [SITE_NAME website](SITE_URL/account/settings).'
  version: '1.0.0'
  title: SITE_NAME API
security:
  - accessToken: []
tags:
  - name: Uploads
    description: Upload files to SITE_NAME
  - name: Auth
    description: Authenticate requests to the API
  - name: Files and Folders
    description: FileEntry refers to either a file or folder on SITE_NAME
  - name: Sharing
    description: Manage file entry collaborators
  - name: Starring
    description: Mark or unmark entries as starred
  - name: Shareable Links
    description: Manage shareable links for file or folder
  - name: Sign
    description: 'Drime Sign e-signature API. Create envelopes (from a PDF or from a reusable template), send them for signature, track signer progress and download the completed artifacts. <br><br> **Scopes**: API tokens need the `sign.read` scope for GET endpoints and `sign.write` for mutations. <br><br> **Idempotency**: `POST /sign/envelopes/from-template` and `POST /sign/envelopes/{slug}/send` accept an optional `Idempotency-Key` header. Retrying a request with the same key within 24 hours replays the original response (flagged with `X-Idempotent-Replay: true`) instead of creating or sending a duplicate. <br><br> **Embedding**: signing pages can be embedded on your own site with the `<drime-sign-form>` widget — load `/js/sign-embed.js` and point `data-src` at a signing link (`/sign/s/{token}`, e.g. the `signing_url` returned by the API) or at a public template form (`/sign/d/{slug}`, enabled per template with `shared_link: true`). Optional attributes: `data-email`, `data-name`, `data-values` (JSON pre-fill), `data-accent-color`, `data-background-color`, `data-with-decline`, `data-with-download`, `data-completed-redirect-url`, `data-min-height`. The element dispatches `load`, `viewed`, `completed` and `declined` CustomEvents. Embedding is blocked by default: allow your site''s domain in Settings > Developers > Embedding (enforced with a CSP `frame-ancestors` header on the signing pages). A live sandbox is available at `/sign/s/demo` — it renders a sample document and never persists anything.'
  - name: Sign Webhooks
    description: "Receive HTTP callbacks when signature events happen. <br><br> **Events**: `envelope.sent`, `envelope.completed`, `envelope.declined`, `signer.viewed`, `signer.signed`, `signer.declined`, `template.created` (plus `webhook.test` fired by the test endpoint). <br><br> **Delivery**: each event is POSTed as JSON `{event_type, event_uuid, timestamp, data}` with headers `User-Agent: Drime-Webhook/1.0`, `X-Drime-Event` (event type) and `X-Drime-Delivery` (delivery id). `event_uuid` is shared across every endpoint the event fans out to — use it to deduplicate. <br><br> **Signature verification**: every request carries `X-Drime-Signature: sha256=HMAC_SHA256(raw_body, secret)` where `secret` is the `whsec_...` value revealed once at webhook creation. Recompute the HMAC over the exact raw request body and compare (constant-time) before trusting a payload. <br><br> **Retry policy**: deliveries that fail (network error or HTTP status >= 400) are retried with exponential backoff — 2, 4, 8 ... 512 minutes, 10 attempts max (~34h). After that the delivery is marked `failed` and can be replayed manually via the resend endpoint or the UI. <br><br> **URL restrictions**: only public http(s) URLs are accepted — localhost, private and reserved IP ranges are refused at registration and again at send time (anti-SSRF)."
paths:
  /uploads:
    post:
      tags:
        - Uploads
      summary: Upload a file to SITE_NAME
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Content of file to upload to SITE_NAME
                parentId:
                  type: integer
                  description: ID of folder where this file should be uploaded, `null` will upload to root
                  example: null
                relativePath:
                  type: string
                  description: "Folders in the path provided here will be auto created, if they don't exist already. This is mainly useful when uploading a folder from browser. It should include original filename as well: <br> `/some/folders/here/file-name.jpg`"
      responses:
        '201':
          description: File was uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  fileEntry:
                    $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
  /drive/file-entries:
    get:
      tags:
        - Files and Folders
      summary: Get file entries
      description: Get the list of all file entries you have access to
      operationId: indexEntry
      parameters:
        - name: perPage
          in: query
          description: How many entries to return per page
          schema:
            type: 'integer'
            format: 'int64'
            default: 50
        - name: deletedOnly
          in: query
          description: Whether only trashed entries should be returned
          schema:
            type: 'boolean'
        - name: starredOnly
          in: query
          description: Whether only starred entries should be returned
          schema:
            type: 'boolean'
        - name: recentOnly
          in: query
          description: Whether only recent entries should be returned
          schema:
            type: 'boolean'
        - name: sharedOnly
          in: query
          description: Whether only entries that have been shared with you should be returned
          schema:
            type: 'boolean'
        - name: query
          in: query
          description: Search query entry names should be filtered on
          schema:
            type: 'string'
        - name: type
          in: query
          description: File type entries should be filtered on
          schema:
            type: 'string'
            enum:
              - 'folder'
              - 'image'
              - 'text'
              - 'audio'
              - 'video'
              - 'pdf'
        - name: parentIds
          in: query
          description: Only entries that are children of specified folders will be returned
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: workspaceId
          in: query
          description: Only return entries in specified workspace
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
  /file-entries:
    delete:
      tags:
        - Files and Folders
      summary: Move entries to trash or delete permanently
      operationId: entriesDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryIds:
                  description: list of entry IDs to delete
                  type: array
                  items:
                    type: string
                deleteForever:
                  description: Whether entries should be deleted permantently, instead of being moved to trash
                  type: string
                  example: false
      responses:
        '200':
          description: Entries deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /file-entries/{entryId}:
    put:
      tags:
        - Files and Folders
      summary: Update an existing file entry
      parameters:
        - in: path
          name: entryId
          schema:
            type: integer
          required: true
      operationId: entryUpdate
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  fileEntry:
                    $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'New name for the entry'
                description:
                  type: string
                  example: 'New description for the entry'

  /folders:
    post:
      tags:
        - Files and Folders
      summary: Create a new folder
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'new folder name'
                parentId:
                  type: integer
                  description: 'ID of parent folder or null if it should be created at root'
                  example: null
      responses:
        '200':
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  folder:
                    $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /file-entries/move:
    post:
      tags:
        - Files and Folders
      summary: Movie specified entries to a different folder
      operationId: entriesMove
      responses:
        '200':
          description: File entries moved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - entryIds
              properties:
                entryIds:
                  description: List of entry ids
                  type: array
                  items:
                    type: integer
                    format: 'int32'
                destinationId:
                  type: integer
                  format: 'int32'
                  description: ID of folder specified entries should be moved to
                  example: null
  /file-entries/duplicate:
    post:
      tags:
        - Files and Folders
      summary: Duplicate specified entries
      operationId: entriesCopy
      responses:
        '200':
          description: File entries duplicated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileEntry'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - entryIds
              properties:
                entryIds:
                  description: List of entry ids
                  type: array
                  items:
                    type: integer
                    format: 'int32'
                destinationId:
                  type: integer
                  format: 'int32'
                  description: ID of folder specified entries should be moved to
                  example: null
  /file-entries/restore:
    post:
      tags:
        - Files and Folders
      summary: Restore file entries from trash to original folder
      operationId: entriesRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entryIds
              properties:
                entryIds:
                  description: List of entry IDs
                  type: array
                  items:
                    type: integer
                    format: 'int32'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /file-entries/{entryId}/share:
    post:
      tags:
        - Sharing
      summary: Share file or folder with specified users
      parameters:
        - in: path
          name: entryId
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    example: example@gmail.com
                permissions:
                  type: array
                  items:
                    type: string
                    example: edit
                    enum:
                      - view
                      - edit
                      - download
      responses:
        '200':
          description: Shared file entry successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
  /file-entries/{entryId}/change-permissions:
    put:
      tags:
        - Sharing
      summary: Change permissions user has for shared entries
      parameters:
        - in: path
          name: entryId
          schema:
            type: integer
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                permissions:
                  type: array
                  items:
                    type: string
                    example: edit
                    enum:
                      - view
                      - edit
                      - download
      responses:
        '200':
          description: Changed permissions successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
  /file-entries/{entryId}/unshare:
    delete:
      tags:
        - Sharing
      summary: Unshare file or folder with specified user
      parameters:
        - in: path
          name: entryId
          schema:
            type: integer
            example: 1
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
      responses:
        '200':
          description: Unshared file entry successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /file-entries/star:
    post:
      tags:
        - Starring
      summary: Mark specified entries as starred
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Marked as starred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  tag:
                    $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
  /file-entries/unstar:
    post:
      tags:
        - Starring
      summary: Unmark specified entries as starred
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Unmarked as starred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  tag:
                    $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /file-entries/{entryId}/shareable-link:
    get:
      tags:
        - Shareable Links
      summary: Retrieve shareable link for specified entry
      operationId: getShareableLink
      parameters:
        - name: entryId
          in: path
          description: ID or hash of entry for which to get shareable link
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shareable-Link-Response'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: File entry or shareable link not found
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
    post:
      tags:
        - Shareable Links
      summary: Create new shareable link for specified entry
      operationId: createShareableLink
      parameters:
        - name: entryId
          in: path
          description: ID or hash of entry for which to get shareable link
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: 'new password'
                expires_at:
                  type: string
                  description: '2021-03-06T17:34:00.000000Z'
                allow_edit:
                  type: boolean
                  example: false
                allow_download:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Shareable link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  link:
                    $ref: '#/components/schemas/ShareableLink'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
  /file_entries/{entryId}/shareable-link:
    put:
      tags:
        - Shareable Links
      summary: Update shareable link details
      operationId: updateShareableLink
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: 'new password'
                expires_at:
                  type: string
                  description: '2021-03-06T17:34:00.000000Z'
                allow_edit:
                  type: boolean
                  example: false
                allow_download:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Shareable link updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  link:
                    $ref: '#/components/schemas/ShareableLink'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: Shareable link not found
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

    delete:
      tags:
        - Shareable Links
      summary: Delete shareable link by ID
      operationId: deleteShareableLink
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Shareable link deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: Shareable link not found
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /auth/register:
    post:
      security: []
      tags:
        - Auth
      summary: Register for a new account
      operationId: register
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'example@gmail.com'
                password:
                  type: string
                  example: 'password'
                device_name:
                  type: string
                  example: 'iphone 12'
  /auth/login:
    post:
      security: []
      tags:
        - Auth
      summary: Get access token
      description: 'Logs in specified user and returns user object along with access token. <br><br> Access Token is a string that enables SITE_NAME to verify that a request belongs to an authorized session. This token should be sent along with every request to SITE_NAME API in a authorization header: `Authorization: Bearer <Token>`.'
      operationId: login
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'example@gmail.com'
                password:
                  type: string
                  example: 'password'
                device_name:
                  type: string
                  example: 'iphone 12'

  /sign/envelopes:
    get:
      tags:
        - Sign
      summary: List envelopes
      description: Paginated list of envelopes in the given context (personal by default, or a workspace via `workspaceId`). Requires the `sign.read` scope.
      operationId: signListEnvelopes
      parameters:
        - name: status
          in: query
          description: Filter by envelope status
          schema:
            type: string
            enum: [draft, pending, completed, declined, expired]
        - name: template_slug
          in: query
          description: Only envelopes instantiated from this template
          schema:
            type: string
        - name: metadata
          in: query
          description: 'Filter on metadata keys set at creation, e.g. `metadata[order_id]=123`. Repeatable; all pairs must match.'
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
        - name: query
          in: query
          description: Search in envelope names
          schema:
            type: string
        - name: perPage
          in: query
          schema:
            type: integer
            default: 15
        - name: workspaceId
          in: query
          description: Workspace context (0 or omitted = personal)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SignEnvelope'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
    post:
      tags:
        - Sign
      summary: Create an envelope (draft)
      description: 'Create a draft envelope from a document. The document can be provided three ways: a multipart `pdf` file, an inline `pdf_base64` string, or a publicly reachable `pdf_url` fetched server-side. Images (png, jpg, gif, webp) are converted to PDF automatically. Max 50MB. Requires the `sign.write` scope.'
      operationId: signCreateEnvelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'NDA - Acme Corp'
                pdf_base64:
                  type: string
                  description: Base64-encoded document (data-URL prefix tolerated). Mutually exclusive with `pdf_url`.
                pdf_url:
                  type: string
                  description: Public http(s) URL of the document, downloaded server-side (private/local addresses are refused).
                  example: 'https://example.com/contract.pdf'
                metadata:
                  type: object
                  description: Free-form correlation data (max 8KB JSON), echoed in responses and webhook payloads.
                  additionalProperties: true
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                pdf:
                  type: string
                  format: binary
                  description: PDF or image file (max 50MB)
      responses:
        '200':
          description: Envelope created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  envelope:
                    $ref: '#/components/schemas/SignEnvelope'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /sign/envelopes/from-template:
    post:
      tags:
        - Sign
      summary: Create an envelope from a template (optionally send it)
      description: 'Instantiate a reusable template: map each template role (`uuid`) to a real person, optionally pre-fill field values, and optionally send in the same call with `send: true` (the monthly send quota is checked before anything is created). Requires the `sign.write` scope.'
      operationId: signCreateFromTemplate
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Retrying with the same key within 24h replays the original response instead of creating a duplicate envelope.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_slug
                - submitters
              properties:
                template_slug:
                  type: string
                  example: 'aBcDeF12'
                submitters:
                  type: array
                  items:
                    type: object
                    required: [uuid, name, email]
                    properties:
                      uuid:
                        type: string
                        description: Role uuid from the template's `submitters` definition
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: 'jane@example.com'
                      values:
                        type: object
                        description: 'Pre-filled field values keyed by field label, e.g. {"First name": "Jane"}. Signature-like fields cannot be pre-filled.'
                        additionalProperties: true
                send:
                  type: boolean
                  description: Create AND send in one call (emails go out immediately)
                  default: false
                name:
                  type: string
                  description: Envelope name (defaults to the template name)
                message:
                  type: string
                  description: Message included in the invitation email
                expires_at:
                  type: string
                  description: 'ISO date in the future, e.g. 2026-08-01T00:00:00Z'
                metadata:
                  type: object
                  description: Free-form correlation data (max 8KB JSON), echoed in responses and webhook payloads.
                  additionalProperties: true
      responses:
        '200':
          description: Envelope created (and sent if `send` was true). Each signer includes its `signing_url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  envelope:
                    $ref: '#/components/schemas/SignEnvelope'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          description: Monthly signature-request quota reached (code `sign_quota_exceeded`)
        '422':
          description: Invalid data specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /sign/envelopes/{slug}:
    get:
      tags:
        - Sign
      summary: Get an envelope
      description: Full envelope with signers (including per-signer `signing_url`), fields and audit log. Completed envelopes also expose `download_url` and `audit_trail_url` (temporary signed URLs, 30 days). Requires the `sign.read` scope.
      operationId: signShowEnvelope
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  envelope:
                    $ref: '#/components/schemas/SignEnvelope'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: Envelope not found

  /sign/envelopes/{slug}/send:
    post:
      tags:
        - Sign
      summary: Send an envelope for signature
      description: Transition a draft to `pending` and email every signer (or only the first one for sequential signing). Counts against the monthly signature-request quota unless self-signing. Requires the `sign.write` scope.
      operationId: signSendEnvelope
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Retrying with the same key within 24h replays the original response instead of re-sending the emails.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                expires_at:
                  type: string
                reminder_enabled:
                  type: boolean
                reminder_interval:
                  type: string
                  enum: [1_day, 2_days, 3_days, 7_days]
      responses:
        '200':
          description: Envelope sent. Each signer includes its `signing_url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  envelope:
                    $ref: '#/components/schemas/SignEnvelope'
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          description: Monthly signature-request quota reached (code `sign_quota_exceeded`)
        '422':
          description: Envelope has no signers or no fields

  /sign/envelopes/{slug}/download:
    get:
      tags:
        - Sign
      summary: Download the (signed) PDF
      description: Returns the final signed PDF for completed envelopes, or the current document otherwise. Requires the `sign.read` scope.
      operationId: signDownloadEnvelope
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/schemas/401-Response'
        '404':
          description: Envelope or PDF not found

  /sign/envelopes/{slug}/download/audit:
    get:
      tags:
        - Sign
      summary: Download the audit trail certificate
      description: PDF certificate listing every audit event (sent, viewed, signed...) with timestamps, IPs and user agents. Requires the `sign.read` scope.
      operationId: signDownloadAudit
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/schemas/401-Response'
        '404':
          description: Envelope not found

  /sign/templates:
    get:
      tags:
        - Sign
      summary: List templates
      description: Reusable templates of the current context (personal or workspace). Use a template's `slug` with `POST /sign/envelopes/from-template`. Requires the `sign.read` scope.
      operationId: signListTemplates
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: perPage
          in: query
          schema:
            type: integer
            default: 15
        - name: workspaceId
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pagination:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SignTemplate'
        '401':
          $ref: '#/components/schemas/401-Response'

  /sign/public-templates/{slug}:
    get:
      tags:
        - Sign
      summary: Get a public template form (no auth)
      description: 'Public metadata of a template whose owner enabled `shared_link`. Used by the `/sign/d/{slug}` form page and the `<drime-sign-form>` widget. Returns 404 when the template does not exist or sharing is disabled. No authentication required; throttled per IP.'
      operationId: signShowPublicTemplate
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  template:
                    type: object
                    properties:
                      slug:
                        type: string
                        example: aB3xY9kQ2mNp
                      name:
                        type: string
                        example: NDA Agreement
                      role:
                        type: string
                        nullable: true
                        description: Name of the signer role the visitor will fill.
                        example: Signer
                      owner_name:
                        type: string
                        nullable: true
                        example: Jane Smith
        '404':
          description: Template not found or not shared

  /sign/public-templates/{slug}/start:
    post:
      tags:
        - Sign
      summary: Start signing a public template (no auth)
      description: 'Creates (or resumes) the visitor''s own copy of a shared template and returns the signing token — open `/sign/s/{token}` or feed it to the embed widget. Idempotent per email: while a pending copy exists for this email, the same token is returned instead of creating a duplicate. The template owner''s monthly request quota is enforced before creation, and an `envelope.sent` webhook fires for every new copy. No authentication required; throttled per IP (10/min).'
      operationId: signStartPublicTemplate
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Signer email — identifies the visitor's copy.
                  example: visitor@example.com
                name:
                  type: string
                  description: Signer display name.
                  example: John Doe
                values:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Optional pre-fill: `{field label: value}`. Signature-like fields are never pre-fillable.'
                  example:
                    Company: ACME Inc.
      responses:
        '200':
          description: Signing session ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  token:
                    type: string
                    description: Signing token — the document is at `/sign/s/{token}`.
                    example: hyN3xkQ9mP2aB7cD4eF6gH8iJ0kL1mN3oP5qR7sT
                  resumed:
                    type: boolean
                    description: True when an existing pending copy was returned instead of creating a new one.
                    example: false
        '404':
          description: Template not found or not shared
        '422':
          description: Validation error, multi-signer template, or the owner's quota is exhausted
        '429':
          description: Too many attempts from this IP

  /sign/webhooks:
    get:
      tags:
        - Sign Webhooks
      summary: List webhooks
      description: Webhooks of the current context (personal, or a workspace via `workspaceId`) with their failed-delivery counts, plus the list of subscribable events.
      operationId: signListWebhooks
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignWebhook'
                  available_events:
                    type: array
                    items:
                      type: string
                    example: [envelope.sent, envelope.completed, envelope.declined, signer.viewed, signer.signed, signer.declined, template.created]
        '401':
          $ref: '#/components/schemas/401-Response'
    post:
      tags:
        - Sign Webhooks
      summary: Register a webhook
      description: 'Register an endpoint for the selected events. The response contains the signing `secret` (`whsec_...`) **exactly once** — store it now, it cannot be retrieved later (only rotated). URLs pointing to localhost or private IP ranges are refused.'
      operationId: signCreateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  example: 'https://example.com/hooks/drime-sign'
                events:
                  type: array
                  items:
                    type: string
                    enum: [envelope.sent, envelope.completed, envelope.declined, signer.viewed, signer.signed, signer.declined, template.created]
                custom_headers:
                  type: object
                  description: 'Up to 10 extra headers sent with every delivery, e.g. {"Authorization": "Bearer xyz"}. Protocol headers (Content-Type, X-Drime-*...) cannot be overridden.'
                  additionalProperties:
                    type: string
                active:
                  type: boolean
                  default: true
                workspaceId:
                  type: integer
                  description: Register at workspace level (every workspace envelope fires it)
                  default: 0
      responses:
        '200':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  webhook:
                    $ref: '#/components/schemas/SignWebhook'
                  secret:
                    type: string
                    description: Plaintext HMAC secret — revealed only in this response
                    example: 'whsec_Zx8mPq2rT5vW9yB3dF6hJ1kL4nQ7sU0aC8eG2iK5'
        '401':
          $ref: '#/components/schemas/401-Response'
        '422':
          description: Invalid data (bad URL, unknown event, private address...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422-Response'

  /sign/webhooks/{id}:
    put:
      tags:
        - Sign Webhooks
      summary: Update a webhook
      description: 'Update URL, events, custom headers or active flag. Pass `rotate_secret: true` to generate a new secret (returned once in the response, old secret stops working immediately).'
      operationId: signUpdateWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                custom_headers:
                  type: object
                  additionalProperties:
                    type: string
                active:
                  type: boolean
                rotate_secret:
                  type: boolean
      responses:
        '200':
          description: Webhook updated (includes `secret` when rotated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  webhook:
                    $ref: '#/components/schemas/SignWebhook'
                  secret:
                    type: string
                    description: Only present when rotate_secret was true
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: Webhook not found
    delete:
      tags:
        - Sign Webhooks
      summary: Delete a webhook
      description: Deletes the endpoint and its whole delivery history.
      operationId: signDeleteWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook deleted
        '401':
          $ref: '#/components/schemas/401-Response'
        '403':
          $ref: '#/components/schemas/403-Response'
        '404':
          description: Webhook not found

  /sign/webhooks/{id}/test:
    post:
      tags:
        - Sign Webhooks
      summary: Send a test event
      description: Queues a synthetic `webhook.test` delivery to the endpoint so you can verify connectivity and HMAC handling end-to-end.
      operationId: signTestWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Test delivery queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  delivery:
                    $ref: '#/components/schemas/SignWebhookDelivery'
        '401':
          $ref: '#/components/schemas/401-Response'
        '404':
          description: Webhook not found

  /sign/webhooks/{id}/deliveries:
    get:
      tags:
        - Sign Webhooks
      summary: List deliveries of a webhook
      description: Paginated delivery log (newest first) with status, attempt count, last HTTP status code and last error.
      operationId: signListWebhookDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pagination:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SignWebhookDelivery'
        '401':
          $ref: '#/components/schemas/401-Response'
        '404':
          description: Webhook not found

  /sign/webhooks/deliveries/{deliveryId}/resend:
    post:
      tags:
        - Sign Webhooks
      summary: Resend a delivery
      description: Replays a delivery (typically a `failed` one) with a fresh retry budget. The original payload and `event_uuid` are reused.
      operationId: signResendWebhookDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delivery requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  delivery:
                    $ref: '#/components/schemas/SignWebhookDelivery'
        '401':
          $ref: '#/components/schemas/401-Response'
        '404':
          description: Delivery not found
components:
  schemas:
    FileEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: image.png
        file_name:
          type: string
          example: j6oWHDG1z613UqFHLZpE1Yrqngw0N8XLuGNLNWJV
          description: actual file name for this entry on storage
        file_size:
          type: integer
          format: int64
          example: 111863
          description: In bytes
        parent_id:
          type: integer
          format: int64
          example: 1
          description: Parent folder ID
        parent:
          $ref: '#/components/schemas/FileEntry'
        thumbnail:
          type: string
          example: thumbnail.png
          description: Relative path to thumbnail image for the file (if it exists)
        mime:
          type: string
          example: image/png
        url:
          type: string
          example: secure/uploads/3260
          description: relative url for previewing file or folder contents
        hash:
          type: string
          example: MzI2MHxwYWRkaQ
        type:
          type: string
          enum:
            - 'image'
            - 'folder'
            - 'text'
            - 'audio'
            - 'video'
            - 'pdf'
        description:
          type: string
          example: Example description entered by user
        deleted_at:
          type: string
          example: '2021-02-23T14:42:38.000000Z'
          description: date entry was moved to trash (if it's in trash currently)
        created_at:
          type: string
          example: '2021-02-23T14:42:38.000000Z'
          description: date entry was uploaded
        updated_at:
          type: string
          example: '2021-02-23T14:42:38.000000Z'
          description: date entry was last modified (content, name or location changed)
        path:
          type: string
          example: '3260/3261/3262'
          description: full path of parent folder IDs for this entry up to root
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              email:
                type: string
                example: 'example@gmail.com'
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        access_token:
          type: string
          description: Access token that can be used to authenticate API requests for this user
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          example: '2021-02-23T14:42:38.000000Z'
        updated_at:
          type: string
          example: '2021-02-23T14:42:38.000000Z'
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: Tag
    ShareableLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
          example: 3h8N1nxZq7WtyRmXDIosFupSl9MCrD
          description: ID for link that will be visible in url
        password:
          type: string
          example: $2y$10$BI8kz6zFeB0CA0P425eMSe7KJcm8OKjWijHTQrRP.cjqRtynMq4Sy
          description: Passwords are hashed, so this will not match the password that was entered in plain text
        user_id:
          type: integer
          format: int64
          description: ID of user that created this link
        entry_id:
          type: integer
          format: int64
          description: ID of file entry this link is attached to
        entry:
          $ref: '#/components/schemas/FileEntry'
        expires_at:
          type: string
          example: '2021-03-06T17:34:00.000000Z'
        allow_edit:
          type: boolean
          example: false
        allow_download:
          type: boolean
          example: false
    Shareable-Link-Response:
      type: object
      properties:
        status:
          type: string
          example: success
        link:
          $ref: '#/components/schemas/ShareableLink'
        folderChildren:
          description: If link is for folder, this will list immediate children of that folder
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
        errors:
          type: object
          properties:
            some_data_1:
              type: string
              example: Error message for data 1
            some_data_2:
              type: string
              example: Error message for data 2
    SignEnvelope:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          example: 'aB3dE5fG'
          description: Public identifier used in every envelope endpoint
        name:
          type: string
          example: 'NDA - Acme Corp'
        status:
          type: string
          enum: [draft, pending, completed, declined, expired]
        signing_order:
          type: string
          enum: [parallel, sequential]
        template_slug:
          type: string
          description: Template this envelope was instantiated from (null for direct uploads)
        metadata:
          type: object
          description: Free-form correlation data set at creation, echoed here and in webhook payloads
          additionalProperties: true
        message:
          type: string
        sent_at:
          type: string
          example: '2026-07-21T14:00:00.000000Z'
        expires_at:
          type: string
        completed_at:
          type: string
        created_at:
          type: string
        download_url:
          type: string
          description: Temporary signed URL (30 days) for the final signed PDF — only present once completed
        audit_trail_url:
          type: string
          description: Temporary signed URL (30 days) for the audit certificate — only present once completed
        signers:
          type: array
          items:
            $ref: '#/components/schemas/SignSigner'
    SignSigner:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 'Jane Doe'
        email:
          type: string
          example: 'jane@example.com'
        status:
          type: string
          enum: [pending, sent, viewed, signed, declined]
        order:
          type: integer
          description: Position in sequential signing
        signing_url:
          type: string
          description: Public link where this signer signs (same URL as the invitation email) — DocuSeal `embed_src` equivalent
          example: 'https://drime.cloud/sign/s/hyN3...'
        viewed_at:
          type: string
        signed_at:
          type: string
        declined_at:
          type: string
        decline_reason:
          type: string
    SignTemplate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          description: Use with POST /sign/envelopes/from-template
        name:
          type: string
        submitters:
          type: array
          description: Roles to map to real people when instantiating
          items:
            type: object
            properties:
              uuid:
                type: string
              name:
                type: string
                example: 'Client'
        created_at:
          type: string
    SignWebhook:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          example: 'https://example.com/hooks/drime-sign'
        events:
          type: array
          items:
            type: string
          example: [envelope.sent, envelope.completed]
        custom_headers:
          type: object
          additionalProperties:
            type: string
        active:
          type: boolean
        workspace_id:
          type: integer
          description: 0 = personal webhook, otherwise fires for every envelope of that workspace
        failed_deliveries_count:
          type: integer
          description: Present in list responses
        created_at:
          type: string
    SignWebhookDelivery:
      type: object
      properties:
        id:
          type: integer
          format: int64
        webhook_id:
          type: integer
        event_type:
          type: string
          example: 'envelope.completed'
        event_uuid:
          type: string
          description: Shared by every endpoint the event fanned out to; echoed in the payload for deduplication
          example: '2f4c1f0e-6a3b-4b1c-9a76-1c2d3e4f5a6b'
        status:
          type: string
          enum: [pending, success, failed]
        attempts:
          type: integer
        last_status_code:
          type: integer
          example: 200
        last_error:
          type: string
        next_retry_at:
          type: string
        created_at:
          type: string
    SignWebhookEventPayload:
      type: object
      description: 'Body POSTed to your endpoint. Verify X-Drime-Signature (sha256=HMAC_SHA256(raw_body, secret)) before trusting it.'
      properties:
        event_type:
          type: string
          example: 'envelope.completed'
        event_uuid:
          type: string
          example: '2f4c1f0e-6a3b-4b1c-9a76-1c2d3e4f5a6b'
        timestamp:
          type: string
          example: '2026-07-21T14:00:00.000000Z'
        data:
          type: object
          description: 'Serialized envelope (see SignEnvelope: status, metadata, signers with signing_url; download_url + audit_trail_url once completed). For signer.* events an extra `signer` key holds the signer concerned. For template.created it is the serialized template.'
    401-Response:
      description: Unauthenticated. Either access token is not provided or is invalid.
    403-Response:
      description: Unauthorized access. You don't have permissions required to perform this operation.
    422-Response:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: 'Reason for the error'
        errors:
          type: object
          properties:
            some_data_1:
              type: string
              example: Error message for data 1
            some_data_2:
              type: string
              example: Error message for data 2

  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
