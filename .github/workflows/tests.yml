name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: "true"

      - name: Install requirements
        run: uv pip install -r pyproject.toml --extra test --no-config

      - name: Tests suite
        run: |
          set -eo pipefail
          pytest \
            --timeout=9 \
            --durations=10 \
            -n auto \
            -vvv \
            --cov=custom_components/drime \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            tests
